services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_backend

  api_backend:
    image: python:3.11-alpine
    volumes:
      - ./server.py:/app/server.py:ro
    working_dir: /app
    command: python server.py